"ہدایت کی کہانیاں تلاش کریں...",heroBadge:"آج کی کہانی",read:"پڑھیں",audio:"آڈیو",video:"ویڈیو",bookmark:"محفوظ کریں",bookmarked:"محفوظ",all:"سب",prophets:"انبیاء",sahaba:"صحابہ",quran:"قرآن",kidsC:"بچے",nextPrayer:"اگلی نماز",location:"آپ کا مقام",update:"اپڈیٹ",bearing:"قبلہ رخ",distance:"کعبہ تک فاصلہ",enableCompass:"کمپاس آن کریں",pointTo:"فون کو اس رخ پر کریں",dark:"ڈارک موڈ",lang:"زبان",about:"نور کے بارے میں",domainInfo:"جی ہاں، noor.ishakai.com جیسا کسٹم ڈومین ہو سکتا ہے - Vercel پر ڈیپلائے کریں",wudu:"وضو کے مراحل",little:"چھوٹا بسم اللہ",camel:"مہربان اونٹ",ant:"بہادر چیونٹی",dua:"سونے سے پہلے دعا",animals:"قرآن میں جانور"}},Xi=[{id:"adam",category:["Prophets"],icon:"\uD83C\uDF3F",gradient:"from-emerald-100 to-teal-50",accent:"#0a7a5e",tr:{en:{title:"Adam - The First Human",summary:"Father of humanity taught the names by Allah.",p1:"Allah created Adam from clay and breathed His spirit into him, teaching him the names of all things. Angels bowed, but Iblis refused out of arrogance.",p2:"Adam and Hawwa lived in Jannah, but were tested with the forbidden tree. After repentance, Allah forgave them and sent them to earth as khalifah to build mercy.",moral:"Humility and repentance elevate; arrogance brings fall."},ar:{title:"آدم - أول البشر",summary:"أبو البشرية علمه الله الأسماء.",p1:"خلق الله آدم من طين ونفخ فيه من روحه وعلمه الأسماء كلها. سجدت الملائكة إلا إبليس استكبر.",p2:"عاش آدم وحواء في الجنة وابتليا بالشجرة المحرمة. بعد التوبة غفر الله لهما وأنزلهما خليفة في الأرض.",moral:"التواضع والتوبة يرفعان، والكبر يسقط."},ml:{title:"ആദം - ആദ്യ മനുഷ്യൻ",summary:"അല്ലാഹു പേരുകൾ പഠിപ്പിച്ച മാനവ പിതാവ്.",p1:"അല്ലാഹു ആദമിനെ കളിമണ്ണിൽ നിന്ന് സൃഷ്ടിച്ച് ആത്മാവ് ഊതി എല്ലാ പേരുകളും പഠിപ്പിച്ചു. മലക്കുകൾ സുജൂദ് ചെയ്തു, ഇബ്ലീസ് അഹങ്കരിച്ചു.",p2:"ആദവും ഹവ്വയും സ്വർഗത്തിൽ ജീവിച്ചു, വിലക്കപ്പെട്ട മരത്താൽ പരീക്ഷിക്കപ്പെട്ടു. തൗബക്ക് ശേഷം അല്ലാഹു പൊറുത്ത് ഭൂമിയിൽ ഖലീഫയാക്കി.",moral:"വിനയവും തൗബയും ഉയർത്തും, അഹങ്കാരം താഴ്ത്തും."},ta:{title:"ஆதம் - முதல் மனிதர்",summary:"அல்லாஹ் பெயர்களை கற்றுக்கொடுத்த மனித தந்தை.",p1:"அல்லாஹ் ஆதமை களிமண்ணிலிருந்து படைத்து ஆன்மாவை ஊதி எல்லா பெயர்களையும் கற்றுக்கொடுத்தான். மலக்குகள் ஸஜ்தா செய்தனர், இப்லீஸ் பெருமை கொண்டான்.",p2:"ஆதமும் ஹவ்வாவும் சுவனத்தில் வாழ்ந்து விலக்கப்பட்ட மரத்தால் சோதிக்கப்பட்டனர். தவ்பாவுக்குப் பின் அல்லாஹ் மன்னித்து பூமியில் கலீஃபாவாக்கினான்.",moral:"பணிவும் தவ்பாவும் உயர்த்தும், பெருமை வீழ்த்தும்."},hi:{title:"आदम - प्रथम मानव",summary:"अल्लाह ने जिन्हें नाम सिखाए, मानवता के पिता।",p1:"अल्लाह ने आदम को मिट्टी से बनाया, रूह फूँकी और सब नाम सिखाए। फरिश्ते झुके पर इब्लीस ने घमंड किया।",p2:"आदम और हव्वा जन्नत में रहे, मना पेड़ से आज़माए गए। तौबा के बाद अल्लाह ने माफ़ कर ज़मीन पर ख़लीफ़ा बनाया।",moral:"विनम्रता और तौबा बुलंद करते हैं, घमंड गिराता है।"},ur:{title:"آدم - پہلے انسان",summary:"اللہ نے نام سکھائے، انسانیت کے والد۔",p1:"اللہ نے آدم کو مٹی سے بنایا، روح پھونکی اور سب نام سکھائے۔ فرشتے جھکے مگر ابلیس نے تکبر کیا۔",p2:"آدم و حوا جنت میں رہے، ممنوعہ درخت سے آزمائے گئے۔ توبہ کے بعد اللہ نے معاف کر کے زمین پر خلیفہ بنایا۔",moral:"عاجزی اور توبہ بلندی دیتی ہے، تکبر پستی۔"}}},{id:"nuh",category:["Prophets"],icon:"\uD83C\uDF0A",gradient:"from-blue-100 to-cyan-50",accent:"#0e7490",tr:{en:{title:"Nuh - The Ark of Faith",summary:"950 years of patience building salvation.",p1:"Nuh called his people for centuries to worship One God. They mocked and plugged their ears. Allah commanded him to build a huge ark far from sea.",p2:"Flood came, ark saved believers and pairs of animals. Nuh's son refused and drowned, showing faith is personal choice, not lineage.",moral:"Patience and trust in Allah saves when world drowns in heedlessness."},ar:{title:"نوح - سفينة الإيمان",summary:"950 عاما من الصبر يبني النجاة.",p1:"دعا نوح قومه قرونا لعبادة الله الواحد، فسخروا وسدوا آذانهم. أمره الله ببناء سفينة ضخمة بعيدا عن البحر.",p2:"جاء الطوفان، نجت السفينة بالمؤمنين وأزواج الحيوانات. رفض ابنه الركوب فغرق، فالإيمان اختيار شخصي.",moral:"الصبر والتوكل على الله ينجي حين يغرق العالم في الغفلة."},ml:{title:"നൂഹ് - വിശ്വാസത്തിന്റെ കപ്പൽ",summary:"950 വർഷത്തെ ക്ഷമ രക്ഷ നിർമ്മിച്ചു.",p1:"നൂഹ് നൂറ്റാണ്ടുകളോളം ഏകദൈവത്തിലേക്ക് ക്ഷണിച്ചു, ജനം പരിഹസിച്ച് ചെവി അടച്ചു. കടലിൽ നിന്ന് ദൂരെ വലിയ കപ്പൽ നിർമ്മിക്കാൻ അല്ലാഹു കൽപ്പിച്ചു.",p2:"പ്രളയം വന്നു, വിശ്വാസികളും ജീവി ജോഡികളും രക്ഷപ്പെട്ടു. മകൻ കയറാൻ വിസമ്മതിച്ച് മുങ്ങി - വിശ്വാസം വ്യക്തിപരമാണ്.",moral:"ലോകം അശ്രദ്ധയിൽ മുങ്ങുമ്പോൾ ക്ഷമയും തവക്കുലും രക്ഷിക്കും."},ta:{title:"நூஹ் - நம்பிக்கை பேழை",summary:"950 ஆண்டு பொறுமை காப்பை கட்டியது.",p1:"நூஹ் நூற்றாண்டுகளாக ஒரே இறைவனுக்கு அழைத்தார், மக்கள் கேலி செய்து காதை அடைத்தனர். கடலிலிருந்து தொலைவில் பெரிய பேழை கட்ட அல்லாஹ் கட்டளையிட்டான்.",p2:"வெள்ளம் வந்தது, நம்பிக்கையாளர்களும் உயிர் ஜோடிகளும் காக்கப்பட்டனர். மகன் ஏற மறுத்து மூழ்கினான் - ஈமான் தனிப்பட்டது.",moral:"உலகம் மறதியில் மூழ்கும்போது பொறுமையும் தவக்குலும் காக்கும்."},hi:{title:"नूह - ईमान की कश्ती",summary:"950 साल सब्र से नजात बनाई।",p1:"नूह ने सदियों एक अल्लाह की दावत दी, लोगों ने मज़ाक उड़ाया कान बंद किए। अल्लाह ने समुंदर से दूर बड़ी कश्ती बनाने का हुक्म दिया।",p2:"सैलाब आया, कश्ती में मोमिन और जानवरों के जोड़े बचे। बेटे ने चढ़ने से इनकार कर डूब गया - ईमान जाती फैसला है।",moral:"सब्र और तवक्कुल बचाता है जब दुनिया ग़फ़लत में डूबे।"},ur:{title:"نوح - ایمان کی کشتی",summary:"950 سال صبر سے نجات بنائی۔",p1:"نوح نے صدیوں ایک اللہ کی دعوت دی، قوم نے مذاق اڑایا کان بند کیے۔ اللہ نے سمندر سے دور بڑی کشتی بنانے کا حکم دیا۔",p2:"طوفان آیا، کشتی میں مومنین اور جانوروں کے جوڑے بچے۔ بیٹے نے سوار ہونے سے انکار کیا ڈوب گیا - ایمان ذاتی فیصلہ ہے۔",moral:"صبر اور توکل بچاتا ہے جب دنیا غفلت میں ڈوبے۔"}}},{id:"ibrahim",category:["Prophets"],icon:"\uD83D\uDD25",gradient:"from-orange-100 to-amber-50",accent:"#b45309",tr:{en:{title:"Ibrahim - Friend of Allah",summary:"Fire became cool for the breaker of idols.",p1:"Ibrahim smashed idols of his people to prove they cannot harm or benefit. Enraged king Nimrod threw him into huge fire.",p2:"Allah said 'O fire, be cool and safe for Ibrahim'. Fire obeyed. Later he was tested to sacrifice son Ismail, and Allah replaced with ram - origin of Eid sacrifice.",moral:"True tawhid makes impossible possible; sacrifice brings closeness."},ar:{title:"إبراهيم - خليل الله",summary:"النار بردت لمحطم الأصنام.",p1:"حطم إبراهيم أصنام قومه ليثبت عجزها. غضب النمرود وألقاه في نار عظيمة.",p2:"قال الله يا نار كوني بردا وسلاما على إبراهيم فأطاعت. ثم ابتلي بذبح ابنه إسماعيل ففداه الله بكبش - أصل الأضحية.",moral:"التوحيد الخالص يجعل المستحيل ممكنا والتضحية تقرب."},ml:{title:"ഇബ്രാഹീം - അല്ലാഹുവിന്റെ സുഹൃത്ത്",summary:"വിഗ്രഹം തകർത്തവന് തീ തണുപ്പായി.",p1:"ജനത്തിന്റെ വിഗ്രഹങ്ങൾക്ക് ഉപകാരമോ ഉപദ്രവമോ ചെയ്യാനാകില്ലെന്ന് തെളിയിക്കാൻ ഇബ്രാഹീം അവ തകർത്തു. നംറൂദ് വലിയ തീയിൽ എറിഞ്ഞു.",p2:"അല്ലാഹു പറഞ്ഞു തീയേ, ഇബ്രാഹീമിന് തണുപ്പും സുരക്ഷയുമാകുക. പിന്നീട് മകൻ ഇസ്മാഈലിനെ ബലിയിടാൻ പരീക്ഷിച്ചു, ആടിനെ പകരം നൽകി.",moral:"യഥാർത്ഥ തൗഹീദ് അസാധ്യത്തെ സാധ്യമാക്കും."},ta:{title:"இப்ராஹீம் - அல்லாஹ்வின் நண்பர்",summary:"சிலை உடைத்தவருக்கு நெருப்பு குளிர்ந்தது.",p1:"தன் மக்களின் சிலைகள் நன்மை தீமை செய்யாது என நிரூபிக்க இப்ராஹீம் அவற்றை உடைத்தார். நம்ரூத் பெரும் நெருப்பில் எறிந்தான்.",p2:"அல்லாஹ் நெருப்பிடம் இப்ராஹீமுக்கு குளிர்ச்சியாக இரு என்றான். பின் மகன் இஸ்மாயீலை பலியிட சோதித்து ஆட்டை பகரமாக்கினான்.",moral:"உண்மை தவ்ஹீத் முடியாததை முடியுமாக்கும்."},hi:{title:"इब्राहीम - अल्लाह के ख़लील",summary:"बुत तोड़ने वाले पर आग ठंडी हुई।",p1:"इब्राहीम ने बुत तोड़े ताकि साबित हो वे नफा-नुकसान नहीं देते। नमरूद ने बड़ी आग में फेंका।",p2:"अल्लाह ने कहा ऐ आग इब्राहीम पर ठंडी सलामती बन जा। फिर बेटे इस्माईल की कुर्बानी का इम्तेहान, अल्लाह ने मेंढ़ा बदल दिया - कुर्बानी की असल।",moral:"सच्ची तौहीद नामुमकिन को मुमकिन बनाती है।"},ur:{title:"ابراہیم - خلیل اللہ",summary:"بت توڑنے والے پر آگ ٹھنڈی ہوئی۔",p1:"ابراہیم نے بت توڑے تاکہ ثابت ہو وہ نفع نقصان نہیں دیتے۔ نمرود نے بڑی آگ میں پھینکا۔",p2:"اللہ نے کہا اے آگ ابراہیم پر ٹھنڈی سلامتی بن جا۔ پھر بیٹے اسماعیل کی قربانی کا امتحان، اللہ نے مینڈھا بدل دیا۔",moral:"سچی توحید ناممکن کو ممکن بناتی ہے۔"}}},{id:"yusuf",category:["Prophets","Quran"],icon:"\uD83D\uDC51",gradient:"from-yellow-100 to-lime-50",accent:"#854d0e",tr:{en:{title:"Yusuf - Beauty & Patience",summary:"From well to throne through forgiveness.",p1:"Brothers threw Yusuf into well from jealousy. Sold as slave, faced seduction in palace, chose prison over sin, interpreted king's dreams.",p2:"Became minister of Egypt, forgave brothers who came for food in famine. Reunited with father Yaqub. Surah Yusuf teaches trust and chastity.",moral:"Patience and purity lead from pit to palace; forgiveness heals families."},ar:{title:"يوسف - الجمال والصبر",summary:"من البئر إلى العرش بالعفو.",p1:"ألقى إخوة يوسف في البئر حسدا. بيع عبدا، وواجه فتنة القصر فاختار السجن على المعصية وفسر رؤيا الملك.",p2:"صار وزير مصر وعفا عن إخوته حين جاؤوا للطعام في المجاعة. اجتمع بأبيه يعقوب. سورة يوسف تعلم التوكل والعفة.",moral:"الصبر والعفة من الجب إلى القصر والعفو يشفي العائلات."},ml:{title:"യൂസുഫ് - സൗന്ദര്യവും ക്ഷമയും",summary:"കിണറ്റിൽ നിന്ന് സിംഹാസനത്തിലേക്ക് പൊറുക്കലിലൂടെ.",p1:"സഹോദരന്മാർ അസൂയയാൽ യൂസുഫിനെ കിണറ്റിൽ എറിഞ്ഞു. അടിമയായി വിറ്റു, കൊട്ടാരത്തിൽ പ്രലോഭനം നേരിട്ട് പാപത്തേക്കാൾ ജയിൽ തിരഞ്ഞെടുത്തു.",p2:"ഈജിപ്തിന്റെ മന്ത്രിയായി, ക്ഷാമകാലത്ത് ഭക്ഷണത്തിനു വന്ന സഹോദരങ്ങളെ പൊറുത്തു. പിതാവ് യഅ്ഖൂബുമായി വീണ്ടും ഒന്നിച്ചു.",moral:"ക്ഷമയും വിശുദ്ധിയും കുഴിയിൽ നിന്ന് കൊട്ടാരത്തിലേക്ക്."},ta:{title:"யூசுப் - அழகும் பொறுமையும்",summary:"கிணற்றிலிருந்து அரியணைக்கு மன்னிப்பால்.",p1:"சகோதரர்கள் பொறாமையால் யூசுபை கிணற்றில் எறிந்தனர். அடிமையாக விற்கப்பட்டு அரண்மனை சோதனையில் பாவத்தை விட சிறை தேர்ந்தெடுத்தார்.",p2:"எகிப்தின் அமைச்சராகி பஞ்சத்தில் உணவுக்கு வந்த சகோதரர்களை மன்னித்தார். தந்தை யாகூபுடன் மீண்டும் சேர்ந்தார்.",moral:"பொறுமையும் தூய்மையும் குழியிலிருந்து அரண்மனைக்கு."},hi:{title:"यूसुफ - हुस्न और सब्र",summary:"कुएँ से तख़्त तक माफ़ी से।",p1:"भाइयों ने हसद से यूसुफ को कुएँ में फेंका। गुलाम बिके, महल में फितने से जेल चुनी, बादशाह के ख्वाब की ताबीर की।",p2:"मिस्र के वज़ीर बने, क़हत में अनाज लेने आए भाइयों को माफ़ किया। वालिद याकूब से मिले। सूरह यूसुफ सब्र सिखाती है।",moral:"सब्र और पाकी गढ़े से महल ले जाती है।"},ur:{title:"یوسف - حسن و صبر",summary:"کنویں سے تخت تک معافی سے۔",p1:"بھائیوں نے حسد سے یوسف کو کنویں میں ڈالا۔ غلام بکے، محل میں فتنہ آیا تو گناہ پر جیل چنی، بادشاہ کے خواب کی تعبیر کی۔",p2:"مصر کے وزیر بنے، قحط میں اناج لینے آئے بھائیوں کو معاف کیا۔ والد یعقوب سے ملے۔",moral:"صبر اور پاکیزگی گڑھے سے محل تک لے جاتی ہے۔"}}},{id:"musa",category:["Prophets","Quran"],icon:"\uD83C\uDF0A",gradient:"from-cyan-100 to-sky-50",accent:"#0e7490",tr:{en:{title:"Musa - Against Pharaoh",summary:"Staff, sea split, and courage.",p1:"Musa raised in Pharaoh's palace, fled after defending oppressed. Allah spoke to him at Mount Tur, gave staff that became serpent and white hand miracle.",p2:"Challenged Pharaoh, sea split for Israelites to cross, Pharaoh drowned. Received Torah, but people worshipped calf in his absence - test of steadfastness.",moral:"Courage with Allah's signs overcomes tyrants; people need constant guidance."},ar:{title:"موسى - ضد فرعون",summary:"عصا، انشقاق بحر، وشجاعة.",p1:"تربى موسى في قصر فرعون وهرب بعد دفاع عن مظلوم. كلمه الله في طور وأعطاه عصا تصير ثعبانا ويد بيضاء آية.",p2:"تحدى فرعون، انشق البحر لبني إسرائيل، غرق فرعون. أوتي التوراة، وعبد قومه العجل في غيابه اختبار الثبات.",moral:"الشجاعة بآيات الله تهزم الطغاة والناس تحتاج توجيها دائما."},ml:{title:"മൂസാ - ഫിർഔനെതിരെ",summary:"വടി, കടൽ പിളർപ്പ്, ധൈര്യം.",p1:"ഫിർഔന്റെ കൊട്ടാരത്തിൽ വളർന്ന മൂസാ, അടിച്ചമർത്തപ്പെട്ടവനെ രക്ഷിച്ച് ഓടി. ത്വൂർ മലയിൽ അല്ലാഹു സംസാരിച്ചു, വടി പാമ്പായി.",p2:"ഫിർഔനെ വെല്ലുവിളിച്ചു, കടൽ പിളർന്ന് ഇസ്രായീല്യർ കടന്നു, ഫിർഔൻ മുങ്ങി. തൗറാത്ത് ലഭിച്ചു, ജനം കാളക്കുട്ടിയെ ആരാധിച്ചു.",moral:"അല്ലാഹുവിന്റെ ദൃഷ്ടാന്തങ്ങളോടെ ധൈര്യം സ്വേച്ഛാധിപതിയെ തോൽപ്പിക്കും."},ta:{title:"மூஸா - ஃபிர்அவ்னுக்கு எதிராக",summary:"கைத்தடி, கடல் பிளவு, துணிச்சல்.",p1:"ஃபிர்அவ்ன் அரண்மனையில் வளர்ந்த மூஸா அடக்கப்பட்டவனை காத்து ஓடினார். தூர் மலையில் அல்லாஹ் பேசி கைத்தடி பாம்பாகும் அற்புதம் கொடுத்தான்.",p2:"ஃபிர்அவ்னை எதிர்த்தார், கடல் பிளந்து இஸ்ராயீலர்கள் கடந்தனர், ஃபிர்அவ்ன் மூழ்கினான். தவ்ராத் பெற்றார், மக்கள் கன்றை வணங்கினர்.",moral:"அல்லாஹ்வின் அத்தாட்சிகளுடன் துணிச்சல் கொடுங்கோலனை வெல்லும்."},hi:{title:"मूसा - फिरऔन के खिलाफ",summary:"लाठी, समुंदर फटा, हिम्मत।",p1:"मूसा फिरऔन के महल में पले, मज़लूम की मदद कर भागे। तूर पर अल्लाह ने बात की, लाठी साँप बनी और हाथ चमका।",p2:"फिरऔन को चैलेंज किया, समुंदर फटा बनी इस्राईल निकले, फिरऔन डूबा। तौरात मिली पर कौम ने बछड़ा पूजा।",moral:"अल्लाह की निशानियों से हिम्मत ज़ालिम को हराती है।"},ur:{title:"موسیٰ - فرعون کے خلاف",summary:"عصا، سمندر پھٹا، ہمت۔",p1:"موسیٰ فرعون کے محل میں پلے، مظلوم کی مدد کر کے بھاگے۔ طور پر اللہ نے کلام کیا، عصا سانپ بنی۔",p2:"فرعون کو للکارا، سمندر پھٹا بنی اسرائیل نکلے، فرعون ڈوبا۔ تورات ملی پر قوم نے بچھڑا پوجا۔",moral:"اللہ کی نشانیوں سے ہمت ظالم کو ہراتی ہے۔"}}},{id:"maryam",category:["Quran","Kids"],icon:"\uD83C\uDF38",gradient:"from-pink-100 to-rose-50",accent:"#be185d",tr:{en:{title:"Maryam - Chosen Woman",summary:"Purity and miraculous birth of Isa.",p1:"Maryam devoted in temple, angel brought pure food. Angel Jibril announced a son - Isa, though she was virgin. People accused, but baby Isa spoke from cradle defending her.",p2:"Maryam's trust shows Allah provides from unexpected. Her chapter in Quran is only woman named, symbol of chastity and tawakkul for all believers.",moral:"Purity and trust bring miracles; Allah defends the sincere."},ar:{title:"مريم - المرأة المصطفاة",summary:"طهارة وميلاد عيسى المعجز.",p1:"كانت مريم عابدة في المحراب يأتيها رزق. بشرها جبريل بابن عيسى وهي عذراء. اتهمها الناس فتكلم عيسى في المهد مدافعا عنها.",p2:"توكل مريم يبين أن الله يرزق من حيث لا يحتسب. سورتها المرأة الوحيدة باسمها في القرآن رمز العفة والتوكل.",moral:"الطهارة والتوكل يأتيان بالمعجزات والله يدافع عن الصادقين."},ml:{title:"മറിയം - തിരഞ്ഞെടുക്കപ്പെട്ട വനിത",summary:"പരിശുദ്ധിയും ഈസായുടെ അത്ഭുത ജനനം.",p1:"ക്ഷേത്രത്തിൽ ഭക്തയായിരുന്ന മറിയത്തിന് മലക്ക് ശുദ്ധമായ ഭക്ഷണം കൊണ്ടുവന്നു. ജിബ്‌രീൽ ഈസാ എന്ന മകനെ അറിയിച്ചു. ജനം ആരോപിച്ചപ്പോൾ തൊട്ടിലിൽ ഈസാ സംസാരിച്ച് അമ്മയെ രക്ഷിച്ചു.",p2:"മറിയത്തിന്റെ തവക്കുൽ അല്ലാഹു അപ്രതീക്ഷിതമായി നൽകുമെന്ന് കാണിക്കുന്നു. ഖുർആനിൽ പേരുള്ള ഏക വനിത.",moral:"പരിശുദ്ധിയും തവക്കുലും അത്ഭുതം കൊണ്ടുവരും."},ta:{title:"மர்யம் - தேர்ந்தெடுக்கப்பட்ட பெண்",summary:"தூய்மை மற்றும் ஈஸாவின் அற்புத பிறப்பு.",p1:"மர்யம் ஆலயத்தில் வணக்கத்தில் இருந்தார், மலக்கு தூய உணவு கொண்டு வந்தார். ஜிப்ரீல் கன்னியாக இருந்தும் ஈஸா மகன் பற்றி நற்செய்தி கூறினார்.",p2:"மக்கள் குற்றம் சாட்டியபோது தொட்டிலில் ஈஸா பேசி தாயை காத்தார். மர்யம் அத்தியாயம் குர்ஆனில் பெயருள்ள ஒரே பெண்.",moral:"தூய்மையும் நம்பிக்கையும் அற்புதம் தரும்."},hi:{title:"मरयम - चुनी हुई ख़ातून",summary:"पाकीज़गी और ईसा की मोजज़ाती पैदाइश।",p1:"मरयम इबादत में थीं, फरिश्ता पाक खाना लाता। जिब्रील ने बेटे ईसा की खुशखबरी दी जबकि वो कुंवारी थीं। लोगों ने तोहमत लगाई तो झूले में ईसा बोले।",p2:"मरयम का तवक्कुल दिखाता है अल्लाह बे-गुमान रिज़्क देता है। क़ुरान में नाम वाली इकलौती औरत।",moral:"पाकी और भरोसा मोजज़े लाते हैं।"},ur:{title:"مریم - چنی ہوئی خاتون",summary:"پاکیزگی اور عیسیٰ کی معجزانہ پیدائش۔",p1:"مریم عبادت میں تھیں، فرشتہ پاک رزق لاتا۔ جبرئیل نے بیٹے عیسیٰ کی بشارت دی حالانکہ کنواری تھیں۔ لوگوں نے الزام لگایا تو جھولے میں عیسیٰ بولے۔",p2:"مریم کا توکل بتاتا ہے اللہ بے گمان رزق دیتا ہے۔ قرآن میں نام والی اکلوتی عورت۔",moral:"پاکی اور بھروسہ معجزے لاتا ہے۔"}}},{id:"kahf",category:["Quran","Kids"],icon:"\uD83D\uDD73️",gradient:"from-violet-100 to-purple-50",accent:"#6d28d9",tr:{en:{title:"Ashab al-Kahf - Sleepers",summary:"Youth who fled tyranny, slept 309 years.",p1:"A group of young believers fled a tyrant king who forced idol worship. They hid in a cave, Allah made them sleep 300 plus 9 years, dog at entrance guarding.",p2:"Awoke thinking a day passed, sent one for food with old coin, people amazed. Story teaches faith over conformity and Allah's power over time.",moral:"Faith protects youth; Allah controls time and sustains believers."},ar:{title:"أصحاب الكهف - النائمون",summary:"شباب فروا من طغيان وناموا 309 أعوام.",p1:"هرب فتية مؤمنون من ملك طاغ يفرض عبادة الأصنام. اختبؤوا في كهف، أنامهم الله 300 وتسع سنين وكلبهم باسط ذراعيه يحرس.",p2:"استيقظوا ظانين يوما، أرسلوا أحدهم بطعام بعملة قديمة فاندهش الناس. القصة تعلم الإيمان على المسايرة وقدرة الله على الزمن.",moral:"الإيمان يحمي الشباب والله يتحكم بالزمن."},ml:{title:"അസ്ഹാബുൽ കഹ്ഫ് - ഉറങ്ങിയവർ",summary:"അതിക്രമത്തിൽ നിന്ന് ഓടി 309 വർഷം ഉറങ്ങിയ യുവാക്കൾ.",p1:"വിഗ്രഹാരാധന നിർബന്ധിച്ച രാജാവിൽ നിന്ന് വിശ്വാസികളായ യുവാക്കൾ ഗുഹയിൽ ഒളിച്ചു. അല്ലാഹു 309 വർഷം ഉറക്കി, നായ കാവൽ നിന്നു.",p2:"ഒരു ദിവസം എന്ന് കരുതി ഉണർന്നു, പഴയ നാണയവുമായി ഭക്ഷണത്തിനു അയച്ചു, ജനം അത്ഭുതപ്പെട്ടു.",moral:"വിശ്വാസം യുവാക്കളെ കാക്കും, സമയം അല്ലാഹുവിന്റെ കയ്യിൽ."},ta:{title:"அஸ்ஹாபுல் கஹ்ஃப் - உறங்கியவர்கள்",summary:"கொடுங்கோலிலிருந்து ஓடி 309 ஆண்டு உறங்கிய இளைஞர்கள்.",p1:"சிலை வணக்கம் கட்டாயப்படுத்திய மன்னனிடமிருந்து நம்பிக்கை இளைஞர்கள் குகையில் ஒளிந்தனர். அல்லாஹ் 309 ஆண்டு உறங்க வைத்தான், நாய் காவல் காத்தது.",p2:"ஒரு நாள் என நினைத்து எழுந்து பழைய நாணயத்துடன் உணவுக்கு அனுப்பினர், மக்கள் வியந்தனர்.",moral:"ஈமான் இளைஞரை காக்கும், நேரம் அல்லாஹ் வசம்."},hi:{title:"असहाब-ए-कहफ़ - सोने वाले",summary:"ज़ुल्म से भागे, 309 साल सोए जवान।",p1:"बुत-परस्ती थोपने वाले बादशाह से मोमिन जवान ग़ार में छिपे। अल्लाह ने 300+9 साल सुलाया, कुत्ता दरवाज़े पर पहरा देता।",p2:"जागे तो लगा एक दिन हुआ, पुराने सिक्के से खाना लेने भेजा लोग हैरान। कहानी ईमान और वक़्त पर अल्लाह की क़ुदरत सिखाती है।",moral:"ईमान जवानों को बचाता है, वक़्त अल्लाह के हाथ में।"},ur:{title:"اصحاب کہف - سونے والے",summary:"ظلم سے بھاگے 309 سال سوئے جوان۔",p1:"بت پرستی مسلط کرنے والے بادشاہ سے مومن جوان غار میں چھپے۔ اللہ نے 309 سال سلایا، کتا دروازے پر پہرہ دیتا۔",p2:"جاگے تو لگا ایک دن ہوا، پرانے سکے سے کھانا لینے بھیجا لوگ حیران۔",moral:"ایمان جوانوں کو بچاتا ہے، وقت اللہ کے ہاتھ میں۔"}}},{id:"bilal",category:["Sahaba","Kids"],icon:"\uD83D\uDCE2",gradient:"from-amber-100 to-orange-50",accent:"#92400e",tr:{en:{title:"Bilal - Voice of Adhan",summary:"From slave to first muadhin, dignity of faith.",p1:"Bilal, Abyssinian slave, tortured on hot sand with rock on chest for saying 'Ahad, Ahad' (One God). Abu Bakr freed him. His deep voice became call to prayer.",p2:"When he called Adhan, hearts trembled. After Prophet's death he couldn't call in Medina out of grief, but his story remains symbol that honor is in taqwa not color or status.",moral:"Faith gives true dignity beyond race and wealth; voice of truth echoes."},ar:{title:"بلال - صوت الأذان",summary:"من عبد إلى أول مؤذن، كرامة الإيمان.",p1:"بلال عبد حبشي عذب على رمل حار بصخرة على صدره لقوله أحد أحد. أعتقه أبو بكر. صار صوته الندي نداء الصلاة.",p2:"حين أذن خشعت القلوب. بعد وفاة النبي لم يستطع الأذان في المدينة حزنا، لكن قصته رمز أن الكرامة بالتقوى لا لون ولا مكانة.",moral:"الإيمان يعطي الكرامة الحقيقية وصوت الحق يبقى."},ml:{title:"ബിലാൽ - ബാങ്കിന്റെ ശബ്ദം",summary:"അടിമയിൽ നിന്ന് ആദ്യ മുഅദ്ദിനായി, വിശ്വാസത്തിന്റെ അന്തസ്.",p1:"അബിസീനിയൻ അടിമ ബിലാൽ, അഹദ് അഹദ് എന്ന് പറഞ്ഞതിന് ചൂടുള്ള മണലിൽ പാറ നെഞ്ചിൽ വെച്ച് പീഡിപ്പിക്കപ്പെട്ടു. അബൂബക്കർ മോചിപ്പിച്ചു.",p2:"അദ്ദേഹത്തിന്റെ ശബ്ദം ബാങ്കായി, ഹൃദയങ്ങൾ വിറച്ചു. പ്രവാചകന്റെ വഫാത്തിന് ശേഷം മദീനയിൽ ബാങ്ക് വിളിക്കാൻ കഴിഞ്ഞില്ല.",moral:"വിശ്വാസം വർണ്ണത്തിനപ്പുറം അന്തസ് നൽകും."},ta:{title:"பிலால் - அதான் குரல்",summary:"அடிமையிலிருந்து முதல் முஅத்தின், ஈமானின் கண்ணியம்.",p1:"அபிசீனிய அடிமை பிலால் அஹத் அஹத் என்றதற்காக சூடான மணலில் பாறை வைத்து சித்திரவதை செய்யப்பட்டார். அபூபக்கர் விடுவித்தார்.",p2:"அவர் குரல் அதானாகி இதயங்கள் நடுங்கின. நபி மரணத்திற்கு பின் மதீனாவில் அதான் சொல்ல முடியவில்லை.",moral:"ஈமான் நிறத்தை தாண்டி கண்ணியம் தரும்."},hi:{title:"बिलाल - अज़ान की आवाज़",summary:"ग़ुलाम से पहले मुअज़्ज़िन, ईमान की इज़्ज़त।",p1:"हब्शी ग़ुलाम बिलाल को अहद-अहद कहने पर गर्म रेत पर पत्थर रख कर सताया गया। अबू बक्र ने आज़ाद किया।",p2:"उनकी आवाज़ अज़ान बनी दिल कांपे। नबी के बाद मदीना में ग़म से अज़ान न दे सके, पर कहानी तक़वा की इज़्ज़त का निशान है।",moral:"ईमान असली इज़्ज़त देता है।"},ur:{title:"بلال - اذان کی آواز",summary:"غلام سے پہلے موذن، ایمان کی عزت۔",p1:"حبشی غلام بلال کو احد احد کہنے پر گرم ریت پر پتھر رکھ کر ستایا گیا۔ ابوبکر نے آزاد کیا۔",p2:"ان کی آواز اذان بنی دل کانپے۔ نبی کے بعد مدینہ میں غم سے اذان نہ دے سکے، پر کہ
